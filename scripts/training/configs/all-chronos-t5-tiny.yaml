training_data_paths:
- "$PROJECTS/lotsa-1024.arrow"
- "$PROJECTS/kernelsynth-data.arrow"
- "$PROJECTS/tsmixup.arrow"
probability:
- 0.3
- 0.6
- 0.1
context_length: 512
prediction_length: 64
input_patch_size: 32
quantiles: ["0.1", "0.5", "0.9"]
use_reg_token: false
min_past: 60
max_steps: 400_000
save_steps: 200_000
log_steps: 1000
per_device_train_batch_size: 350
learning_rate: 0.001
optim: adamw_torch_fused
num_samples: 20
shuffle_buffer_length: 200_000
gradient_accumulation_steps: 1
model_id: google/t5-efficient-tiny
model_type: seq2seq
random_init: true
tie_embeddings: true
output_dir: ./output/
tf32: true
torch_compile: true
tokenizer_class: "MeanScaleUniformBins"
tokenizer_kwargs:
  low_limit: -15.0
  high_limit: 15.0
n_tokens: 4096
lr_scheduler_type: linear
warmup_ratio: 0.0
dataloader_num_workers: 2
max_missing_prop: 0.9
use_eos_token: true
